<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة التحكم | Verison Travel</title>
    
    <!-- مكتبة Supabase الرسمية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0d1b2a, #1b2a3d);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212,175,55,0.4);
            border-radius: 20px;
            padding: 40px 35px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }
        .logo span { color: #d4af37; }
        .subtitle {
            text-align: center;
            color: #ccc;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            color: #d4af37;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(15,23,42,0.8);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        input:focus { border-color: #d4af37; }
        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #aa8214);
            color: #0d1b2a;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-btn:hover { opacity: 0.9; }
        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo">VERISON <span>TRAVEL</span></div>
        <p class="subtitle">لوحة تحكم الإدارة</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="admin@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">تسجيل الدخول</button>
            <p class="error-msg" id="errorMsg">البريد الإلكتروني أو كلمة المرور غير صحيحة</p>
        </form>
    </div>

    <script src="script.js"></script>
    <script>
        const form = document.getElementById("loginForm");
        const errorMsg = document.getElementById("errorMsg");

        form.addEventListener("submit", async function(e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            errorMsg.style.display = "none";

            if (!supabaseClient) {
                alert("يرجى التأكد من ضبط مفاتيح Supabase داخل ملف script.js أولاً.");
                return;
            }

            // تسجيل الدخول باستخدام Supabase Auth
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                errorMsg.textContent = "البريد الإلكتروني أو كلمة المرور غير صحيحة";
                errorMsg.style.display = "block";
            } else {
                // النجاح والتوجه للوحة التحكم
                window.location.href = "dashboard.html";
            }
        });
    </script>

</body>
</html>
