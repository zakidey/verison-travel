<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Verison Travel</title>
    
    <!-- مكتبة Supabase الرسمية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #0d1b2a;
            min-height: 100vh;
        }
        .topbar {
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(212,175,55,0.3);
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { color: #fff; font-weight: bold; font-size: 20px; }
        .logo span { color: #d4af37; }
        .logout-btn {
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        .logout-btn:hover { background: #d4af37; color: #0d1b2a; }
        .welcome {
            text-align: center;
            color: #fff;
            padding: 50px 20px 20px;
        }
        .welcome h1 { color: #d4af37; margin-bottom: 8px; }
        .welcome p { color: #ccc; font-size: 14px; }
        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 30px 20px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 15px;
            padding: 30px;
            width: 220px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            transition: 0.3s;
        }
        .card:hover { border-color: #d4af37; transform: translateY(-3px); }
        .card .icon { font-size: 32px; margin-bottom: 10px; }
        .card h3 { color: #d4af37; margin-bottom: 5px; }
        .card p { color: #aaa; font-size: 13px; }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="logo">VERISON <span>TRAVEL</span> — لوحة التحكم</div>
        <button class="logout-btn" id="logoutBtn">تسجيل الخروج</button>
    </div>

    <div class="welcome">
        <h1 id="welcomeText">مرحبًا بك 👋</h1>
        <p id="userEmail">جاري التحقق من الجلسة...</p>
    </div>

    <div class="cards">
        <a href="bookings.html" class="card">
            <div class="icon">📋</div>
            <h3>الحجوزات</h3>
            <p>عرض وإدارة جميع طلبات الحجز</p>
        </a>
    </div>

    <script src="script.js"></script>
    <script>
        // التحقق من حالة تسجيل الدخول باستخدام Supabase
        document.addEventListener("DOMContentLoaded", async function() {
            if (!supabaseClient) return;

            // الحصول على المستخدم الحالي
            const { data: { user } } = await supabaseClient.auth.getUser();

            if (!user) {
                // إذا لم يكن مسجل الدخول، يتم توجيهه إلى صفحة تسجيل الدخول
                window.location.href = "login.html";
            } else {
                document.getElementById("userEmail").textContent = user.email;
            }

            // زر تسجيل الخروج
            document.getElementById("logoutBtn").addEventListener("click", async function() {
                await supabaseClient.auth.signOut();
                window.location.href = "login.html";
            });
        });
    </script>

</body>
</html>
